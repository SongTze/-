<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6f1">
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="card-header">
          <p class="eyebrow">留一點空間，專注眼前</p>
          <h1 id="page-title">待辦清單</h1>
          <p class="subtitle">把想到的事記下來，一件一件完成。</p>
        </header>

        <form class="todo-form" id="todo-form">
          <label class="visually-hidden" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="接下來要做什麼？"
            autocomplete="off"
            maxlength="200"
            required
          >
          <button class="add-button" type="submit">新增</button>
        </form>

        <ul class="todo-list" id="todo-list" aria-label="待辦事項"></ul>
        <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>

        <footer class="card-footer">
          <span class="remaining-count" id="remaining-count" aria-live="polite">未完成:0 項</span>
        </footer>
      </section>
      <p class="page-note">慢慢來，也是在前進。</p>
    </main>
  </body>
</html>
